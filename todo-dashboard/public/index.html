<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A simple to-do list that saves tasks in your browser.">
  <title>My to-do list</title>
  <style>
    :root { color-scheme: light; --bg:#f4f7fb; --card:#fff; --text:#172033; --muted:#6d7890; --accent:#4f46e5; --line:#e4e8f0; --danger:#c0392b; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font:16px/1.5 system-ui,-apple-system,sans-serif; color:var(--text); background:linear-gradient(135deg,#eef2ff,var(--bg)); }
    main { width:min(720px,92%); margin:auto; padding:56px 0; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:24px; padding:clamp(22px,5vw,42px); box-shadow:0 18px 50px #27346918; }
    h1 { margin:0 0 8px; font-size:clamp(2rem,6vw,3.5rem); letter-spacing:-.04em; } .muted { color:var(--muted); }
    form { display:flex; gap:10px; margin:28px 0 18px; } input { min-width:0; flex:1; border:1px solid var(--line); border-radius:12px; padding:13px 15px; font:inherit; } button { border:0; border-radius:12px; padding:12px 16px; font:inherit; font-weight:700; cursor:pointer; background:var(--accent); color:white; } button:hover { filter:brightness(.95); } button:focus-visible,input:focus-visible { outline:3px solid #a5b4fc; outline-offset:2px; }
    .toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:12px 0; } .filters { display:flex; gap:6px; } .filter { padding:7px 10px; color:var(--muted); background:transparent; } .filter.active { color:var(--accent); background:#eef2ff; } .clear { padding:7px 10px; color:var(--danger); background:transparent; }
    ul { list-style:none; padding:0; margin:18px 0 0; } li { display:flex; align-items:center; gap:12px; padding:15px 0; border-bottom:1px solid var(--line); } li:last-child { border-bottom:0; } li label { display:flex; align-items:center; gap:12px; flex:1; min-width:0; } li input[type=checkbox] { width:19px; height:19px; accent-color:var(--accent); } li.completed .title { color:var(--muted); text-decoration:line-through; } .title { overflow-wrap:anywhere; } .delete { padding:6px 9px; color:var(--danger); background:transparent; } #empty { padding:28px 0; text-align:center; color:var(--muted); } @media (max-width:480px) { form { flex-direction:column; } .toolbar { align-items:flex-start; flex-direction:column; } }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="heading">
      <p class="muted">Saved privately in this browser</p>
      <h1 id="heading">My to-do list</h1>
      <p class="muted"><span id="remaining">0</span> tasks remaining</p>
      <form id="todo-form">
        <label for="todo-input" class="visually-hidden">Add a task</label>
        <input id="todo-input" maxlength="160" autocomplete="off" placeholder="What needs to be done?" required>
        <button type="submit">Add task</button>
      </form>
      <div class="toolbar">
        <div class="filters" aria-label="Filter tasks">
          <button class="filter active" data-filter="all" type="button">All</button>
          <button class="filter" data-filter="active" type="button">Active</button>
          <button class="filter" data-filter="completed" type="button">Completed</button>
        </div>
        <button id="clear-completed" class="clear" type="button">Clear completed</button>
      </div>
      <ul id="todo-list" aria-live="polite"></ul>
      <p id="empty">No tasks yet. Add your first one above.</p>
    </section>
  </main>
  <script>
    const STORAGE_KEY = 'debit-now-todos-v1';
    let todos = loadTodos();
    let filter = 'all';
    const input = document.getElementById('todo-input');
    const list = document.getElementById('todo-list');
    const empty = document.getElementById('empty');
    const remaining = document.getElementById('remaining');

    function loadTodos() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        return Array.isArray(saved) ? saved : [];
      } catch { return []; }
    }
    function saveTodos() { localStorage.setItem(STORAGE_KEY, JSON.stringify(todos)); }
    function visibleTodos() { return todos.filter(todo => filter === 'all' || (filter === 'active' ? !todo.completed : todo.completed)); }
    function render() {
      list.replaceChildren();
      const visible = visibleTodos();
      visible.forEach(todo => {
        const item = document.createElement('li');
        item.className = todo.completed ? 'completed' : '';
        const label = document.createElement('label');
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox'; checkbox.checked = todo.completed; checkbox.setAttribute('aria-label', `Mark ${todo.title} complete`);
        checkbox.addEventListener('change', () => { todo.completed = checkbox.checked; saveTodos(); render(); });
        const title = document.createElement('span'); title.className = 'title'; title.textContent = todo.title;
        label.append(checkbox, title);
        const remove = document.createElement('button'); remove.className = 'delete'; remove.type = 'button'; remove.textContent = 'Delete'; remove.setAttribute('aria-label', `Delete ${todo.title}`);
        remove.addEventListener('click', () => { todos = todos.filter(entry => entry.id !== todo.id); saveTodos(); render(); });
        item.append(label, remove); list.append(item);
      });
      empty.hidden = visible.length !== 0;
      empty.textContent = todos.length && !visible.length ? 'No tasks match this filter.' : 'No tasks yet. Add your first one above.';
      remaining.textContent = todos.filter(todo => !todo.completed).length;
      document.querySelectorAll('.filter').forEach(button => button.classList.toggle('active', button.dataset.filter === filter));
    }
    document.getElementById('todo-form').addEventListener('submit', event => {
      event.preventDefault(); const title = input.value.trim(); if (!title) return;
      todos.unshift({ id: crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`, title, completed: false });
      saveTodos(); input.value = ''; render(); input.focus();
    });
    document.querySelectorAll('.filter').forEach(button => button.addEventListener('click', () => { filter = button.dataset.filter; render(); }));
    document.getElementById('clear-completed').addEventListener('click', () => { todos = todos.filter(todo => !todo.completed); saveTodos(); render(); });
    render();
  </script>
</body>
</html>
