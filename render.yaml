services:
  - type: web
    name: debit-now-ai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: OTP_PEPPER
        generateValue: true
      - key: VERIFY_TOKEN
        generateValue: true
