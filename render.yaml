services:
  - type: web
    name: debit-now-ai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: OTP_PEPPER
        generateValue: true
      - key: VERIFY_TOKEN
        generateValue: true
      - key: SMS_GATEWAY
        value: mock
      - key: OTP_VALID_MINUTES
        value: "5"
      - key: OTP_MAX_ATTEMPTS
        value: "3"
